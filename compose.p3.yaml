services:
  p3-http-checks:
    image: node:22.23.4-bookworm-slim
    environment:
      BASE_URL: http://frontend:3000
      P3_EVIDENCE_FILE: /evidence/p3-assets.json
    volumes:
      - ./scripts:/checks:ro
      - ./demo-assets:/demo:ro
      - ./.local:/evidence
    command: ["node", "/checks/smoke-p3.mjs"]
    depends_on:
      frontend:
        condition: service_healthy
